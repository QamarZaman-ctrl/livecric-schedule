name: Daily Cricket Update

on:
  schedule:
    - cron: '0 0 * * *' # Rozana raat ko khud chalega
  workflow_dispatch: # Manual button ke liye

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Run update script
        run: python update_matches.py
        env:
          RAPID_API_KEY: ${{ secrets.RAPID_API_KEY }}

      - name: Commit and Push changes
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add matches.json
          # Agar koi change nahi hai toh error nahi dega
          git commit -m "Automated Match Update" || echo "No changes to commit"
          git push
