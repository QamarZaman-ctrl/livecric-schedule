<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Cricket Schedule | Global Match Center</title>
    
    <!-- SEO & Performance -->
    <link rel="icon" type="favicon" href="icon.png">
    <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/webfonts/fa-solid-900.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/webfonts/fa-brands-400.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"></noscript>

    <style>
        /* --- Global Reset --- */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { background-color: #0b0e11; font-family: 'Segoe UI', Roboto, sans-serif; width: 100%; color: white; overflow-x: hidden; }

        /* --- Header & Nav (As per your original) --- */
        header {
            background-color: #01080b; padding: 0 5%; height: 75px; 
            display: flex; justify-content: space-between; align-items: center; 
            border-bottom: 1px solid rgba(0, 210, 255, 0.2); position: sticky; top: 0; z-index: 1000;
        }
        .nav-links { display: flex; gap: 35px; list-style: none; align-items: center; }
        .nav-links a { color: rgba(255,255,255,0.8); text-decoration: none; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        .support-btn { background-color: #00d2ff; color: #01080b; padding: 10px 22px; border-radius: 6px; font-weight: 800; text-decoration: none; font-size: 12px; text-transform: uppercase; }

        /* --- Hero Section (Desktop Fixed) --- */
        .hero-section {
            background-color: #011214; height: 45vh; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; text-align: center; position: relative; 
            padding: 0 5%; border-bottom: 1px solid #035263;
        }
        .left-stack { position: absolute; left: 3%; top: 20px; width: 200px; display: flex; flex-direction: column; gap: 5px; z-index: 10; }
        .right-stack { position: absolute; right: 3%; top: 20px; width: 140px; display: flex; flex-direction: column; gap: 8px; z-index: 10; }

        /* --- Match Cards Layout (Fixed Alignment) --- */
        #fixtures-container { padding: 25px 15px; width: 100%; max-width: 900px; margin: 0 auto; }
        .match-card {
            width: 100%; border-radius: 18px; padding: 15px; display: flex; flex-direction: column; 
            border: 1px solid rgba(255,255,255,0.1); background: linear-gradient(135deg, #0a0707 20%, #002939 100%); margin-bottom: 20px;
        }
        .match-main { display: flex; justify-content: space-between; align-items: center; width: 100%; flex-wrap: wrap; }
        .team-box { display: flex; align-items: center; gap: 10px; flex: 1; }
        .team-logo { width: 55px; height: 55px; border-radius: 50%; background: white; object-fit: cover; border: 2px solid #00d2ff33; }
        .vs-badge { font-size: 20px; font-weight: 900; color: #00d2ff; text-align: center; width: 40px; }
        .match-meta { display: flex; justify-content: space-between; border-top: 1px solid #ffffff1a; padding-top: 12px; margin-top: 12px; font-size: 11px; color: #ffffffb3; }

        /* --- Responsive Queries --- */
        @media (max-width: 950px) {
            header { height: auto; padding: 15px 5%; flex-direction: column; gap: 15px; }
            .nav-links { gap: 15px; font-size: 11px; }
            .hero-section { height: auto; padding: 100px 5% 40px; }
            .left-stack { position: absolute; left: 50%; top: 20px; transform: translateX(-50%); width: 90%; max-width: 350px; }
            .right-stack { position: relative; right: auto; top: 20px; width: 100%; flex-direction: row; justify-content: center; }
            .team-box { flex-direction: column; text-align: center; }
        }

        /* --- Loading Spinner --- */
        .loading-state { text-align: center; padding: 60px; }
        .spinner { border: 3px solid #00d2ff1a; width: 40px; height: 40px; border-radius: 50%; border-left-color: #00d2ff; animation: spin 1s linear infinite; margin: 0 auto 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<header>
    <div class="logo">
        <a href="https://livecricschedule.live" style="font-size: 20px; font-weight: 800; color: #00d2ff; text-decoration: none; text-transform: uppercase; letter-spacing: 1px;">
            <i class="fas fa-trophy" style="margin-right: 10px;"></i>GLOBAL MATCH CENTER
        </a>
    </div>
    <nav>
        <ul class="nav-links">
            <li><a href="index.html">HOME</a></li>
            <li><a href="about.html">ABOUT</a></li>
            <li><a href="contact.html">CONTACT</a></li>
            <li><a href="privacy.html">PRIVACY</a></li>
        </ul>
    </nav>
    <a href="contact.html" class="support-btn"><i class="fas fa-headset" style="margin-right: 7px;"></i>SUPPORT</a>
</header>

<div id="main-wrapper">
    <section class="hero-section">
        <div class="left-stack">
            <div style="position: relative;">
                <i class="fas fa-search" style="position: absolute; left: 10px; top: 9px; color: #00d2ff80; font-size: 11px;"></i>
                <input type="text" id="matchSearch" onkeyup="filterMatches()" placeholder="Search matches..." 
                       style="width: 100%; padding: 6px 10px 6px 30px; border-radius: 5px; border: 1px solid #00d2ff33; background: #ffffff08; color: white; outline: none; font-size: 11px;">
            </div>
            <select id="categorySelect" onchange="filterByCategory(this.value, event)" style="width: 100%; padding: 6px 10px; border-radius: 5px; border: 1px solid #00d2ff4d; background: #0b141d; color: #00d2ff; font-size: 10px; font-weight: 700; text-transform: uppercase; cursor: pointer;">
                <option value="all">CATEGORIES</option>
                <option value="icc">International</option>
                <option value="psl">PSL</option>
                <option value="ipl">IPL</option>
            </select>
        </div>

        <div class="right-stack">
            <a href="https://tamashaweb.com/" target="_blank" style="background: #111; border: 1px solid #333; color: white; padding: 6px 12px; text-decoration: none; border-radius: 5px; font-weight: 700; font-size: 10px; display: flex; align-items: center; justify-content: center;">
                <span style="height: 6px; width: 6px; background: #ff0000; border-radius: 50%; margin-right: 8px;"></span> Watch Live
            </a>
            <a href="https://www.tensportstv.com/" target="_blank" style="background: #111; border: 1px solid #333; color: white; padding: 6px 12px; text-decoration: none; border-radius: 5px; font-weight: 700; font-size: 10px; display: flex; align-items: center; justify-content: center;">
                <i class="fas fa-tv" style="margin-right: 8px; color: #92B558;"></i> Ten Sports
            </a>
        </div>

        <div>
            <h1 style="font-size: 2.8rem; color: #ffffff; font-weight: 900; text-transform: uppercase;">🏏 Global Match Center</h1>
            <p style="margin-top: 10px; font-size: 14px; color: #ffffff99;">Real-time Fixtures & Live Streaming</p>
        </div>
    </section>

    <main id="fixtures-container">
        <div id="fixtures-list">
            <div class="loading-state">
                <div class="spinner"></div>
                <p>Fetching Live Schedule...</p>
            </div>
        </div>
    </main>
</div>

<script src="script.js" defer></script>
</body>
</html>
