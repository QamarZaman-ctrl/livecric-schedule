<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Cricket Schedule | Global Match Center</title>
    
    <link rel="icon" type="favicon" href="icon.png">
    <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/webfonts/fa-solid-900.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/webfonts/fa-brands-400.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"></noscript>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { background-color: #0b0e11; font-family: 'Segoe UI', Roboto, sans-serif; width: 100%; color: white; overflow-x: hidden; }

        /* --- Header --- */
        header {
            background-color: #01080b; padding: 0 5%; height: 75px; 
            display: flex; justify-content: space-between; align-items: center; 
            border-bottom: 1px solid rgba(0, 210, 255, 0.2); position: sticky; top: 0; z-index: 1000;
        }
        .nav-links { display: flex; gap: 30px; list-style: none; }
        .nav-links a { color: rgba(255,255,255,0.8); text-decoration: none; font-size: 13px; font-weight: 600; text-transform: uppercase; }
        .support-btn { background-color: #00d2ff; color: #01080b; padding: 10px 20px; border-radius: 6px; font-weight: 800; text-decoration: none; font-size: 12px; }

        /* --- Hero Section (Fixed Overlap) --- */
        .hero-section {
            background-color: #011214; min-height: 50vh; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; text-align: center; 
            padding: 40px 5%; border-bottom: 1px solid #035263; gap: 20px;
        }

        .controls-row { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 400px; }
        .search-container { position: relative; width: 100%; }
        .search-container i { position: absolute; left: 12px; top: 12px; color: #00d2ff80; }
        #matchSearch { width: 100%; padding: 10px 10px 10px 35px; border-radius: 8px; border: 1px solid #00d2ff33; background: #ffffff08; color: white; outline: none; }
        
        #categorySelect { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #00d2ff4d; background: #0b141d; color: #00d2ff; font-weight: 700; text-transform: uppercase; }

        .streaming-btns { display: flex; gap: 15px; margin-top: 5px; }
        .btn-live { background: #111; color: white; padding: 10px 18px; text-decoration: none; border-radius: 8px; font-weight: 700; font-size: 12px; border: 1px solid #333; display: flex; align-items: center; gap: 8px; }
        .dot { height: 8px; width: 8px; background: #ff0000; border-radius: 50%; box-shadow: 0 0 8px #ff0000; }

        /* --- Match Cards Layout --- */
        #fixtures-container { padding: 30px 15px; width: 100%; max-width: 1000px; margin: 0 auto; }
        .match-card {
            width: 100%; border-radius: 15px; padding: 25px; 
            background: linear-gradient(135deg, #0a0e14 0%, #061621 100%); 
            border: 1px solid rgba(0, 210, 255, 0.1); margin-bottom: 25px;
        }
        
        /* Grid for card elements */
        .match-row { 
            display: grid; 
            grid-template-columns: 2fr 1fr 2fr 1.5fr; 
            align-items: center; 
            text-align: center;
            gap: 20px;
        }

        .team-section { display: flex; align-items: center; gap: 12px; font-weight: 700; }
        .team-logo { width: 45px; height: 45px; border-radius: 50%; background: white; object-fit: cover; }
        .vs-text { color: #00d2ff; font-weight: 900; font-size: 18px; }
        
        .match-info-item { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; color: #ffffffb3; }
        .match-info-item i { color: #00d2ff; font-size: 14px; }

        @media (max-width: 850px) {
            header { height: auto; padding: 15px 5%; flex-direction: column; gap: 15px; }
            .nav-links { gap: 15px; display: none; } /* Hide nav on mobile for speed */
            .hero-section h1 { font-size: 1.8rem !important; }
            .match-row { grid-template-columns: 1fr; gap: 15px; }
            .team-section { justify-content: center; }
        }

        .spinner { border: 3px solid #00d2ff1a; width: 40px; height: 40px; border-radius: 50%; border-left-color: #00d2ff; animation: spin 1s linear infinite; margin: 0 auto 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<header>
    <a href="https://livecricschedule.live" style="font-size: 18px; font-weight: 800; color: #00d2ff; text-decoration: none;">
        <i class="fas fa-trophy" style="margin-right: 8px;"></i>GLOBAL MATCH CENTER
    </a>
    <nav>
        <ul class="nav-links">
            <li><a href="index.html">HOME</a></li>
            <li><a href="about.html">ABOUT</a></li>
            <li><a href="privacy.html">PRIVACY</a></li>
        </ul>
    </nav>
    <a href="contact.html" class="support-btn"><i class="fas fa-headset"></i> SUPPORT</a>
</header>

<div id="main-wrapper">
    <section class="hero-section">
        <div class="controls-row">
            <div class="search-container">
                <i class="fas fa-search"></i>
                <input type="text" id="matchSearch" onkeyup="filterMatches()" placeholder="Search matches...">
            </div>
            <select id="categorySelect" onchange="filterByCategory(this.value, event)">
                <option value="all">CATEGORIES</option>
                <option value="icc">International</option>
                <option value="psl">PSL</option>
                <option value="ipl">IPL</option>
            </select>
        </div>

        <div class="streaming-btns">
            <a href="https://tamashaweb.com/" target="_blank" class="btn-live"><span class="dot"></span> Watch Live</a>
            <a href="https://www.tensportstv.com/" target="_blank" class="btn-live"><i class="fas fa-tv" style="color: #92B558;"></i> Ten Sports</a>
        </div>

        <h1 style="font-size: 3rem; font-weight: 900; text-transform: uppercase; letter-spacing: 1px;">GLOBAL MATCH CENTER</h1>
        <p style="color: #ffffff80; font-size: 15px;">Real-time Fixtures & Live Streaming</p>
    </section>

    <main id="fixtures-container">
        <div id="fixtures-list">
            <div style="text-align: center; padding: 50px;">
                <div class="spinner"></div>
                <p>Fetching Matches...</p>
            </div>
        </div>
    </main>
</div>

<script src="script.js" defer></script>
</body>
</html>
