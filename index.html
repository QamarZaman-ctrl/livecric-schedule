<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Cricket Schedule | Global Match Center</title>
    
    <!-- SEO & Icons -->
    <link rel="icon" type="favicon" href="icon.png">
    <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/webfonts/fa-solid-900.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/webfonts/fa-brands-400.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"></noscript>

    <style>
        /* --- Global Reset & Base --- */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { background-color: #0b0e11; font-family: 'Segoe UI', Roboto, sans-serif; width: 100%; color: white; overflow-x: hidden; }

        /* --- Hero Section Responsive Logic --- */
        .hero-section {
            background-color: #011214; 
            min-height: 45vh; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            text-align: center; 
            position: relative; 
            padding: 40px 5%;
            border-bottom: 1px solid #035263;
        }

        .left-stack {
            position: absolute; left: 3%; top: 20px; width: 200px; 
            display: flex; flex-direction: column; gap: 5px; z-index: 10;
        }

        .right-stack {
            position: absolute; right: 3%; top: 20px; width: 140px;
            display: flex; flex-direction: column; gap: 8px; z-index: 10;
        }

        .center-branding { margin-top: 20px; }

        /* --- Mobile Responsive (max-width: 768px) --- */
        @media (max-width: 768px) {
            .hero-section { height: auto; padding-top: 20px; }
            
            /* Absolute hata kar normal flow mein lana */
            .left-stack, .right-stack { 
                position: static; 
                width: 100%; 
                max-width: 300px; 
                margin-bottom: 20px;
            }

            .right-stack { 
                flex-direction: row; 
                width: 100%; 
                max-width: 100%; 
                justify-content: center; 
                order: 3; /* Buttons ko branding ke niche le jana */
            }

            .right-stack a { flex: 1; max-width: 150px; }

            .center-branding { order: 2; margin-bottom: 20px; }
            .center-branding h1 { font-size: 1.8rem !important; }
            
            .left-stack { order: 1; } /* Search bar sabse upar */
        }

        /* --- Match Cards Container --- */
        #fixtures-container { padding: 25px 15px; width: 100%; max-width: 900px; margin: 0 auto; }
        #fixtures-list { display: flex; flex-direction: column; gap: 20px; }
        .match-card {
            width: 100%; border-radius: 18px; padding: 15px; display: flex; flex-direction: column; 
            border: 1px solid rgba(255,255,255,0.1); background: linear-gradient(135deg, #0a0707 20%, #002939 100%);
        }

        /* --- Team Styling --- */
        .team-logo { width: 60px; height: 60px; border-radius: 50%; background: white; object-fit: cover; border: 2px solid rgba(0, 210, 255, 0.3); margin-bottom: 10px; }
        .vs-badge { font-size: 22px; font-weight: 900; color: #00d2ff; margin: 0 15px; text-shadow: 0 0 10px rgba(0, 210, 255, 0.5); }
        .match-meta { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 12px; margin-top: 12px; font-size: 12px; color: rgba(255,255,255,0.7); }

        /* --- Spinner --- */
        .loading-state { text-align: center; padding: 60px; }
        .spinner { border: 3px solid rgba(0, 210, 255, 0.1); width: 40px; height: 40px; border-radius: 50%; border-left-color: #00d2ff; animation: spin 1s linear infinite; margin: 0 auto 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>

<body>

<header style="background-color: #01080b; padding: 0 5%; height: 75px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(0, 210, 255, 0.2); position: sticky; top: 0; z-index: 1000; font-family: sans-serif;">
    <div style="display: flex; align-items: center;">
        <a href="https://livecricschedule.live" style="font-size: 18px; font-weight: 800; color: #00d2ff; text-decoration: none; text-transform: uppercase;">
            <i class="fas fa-trophy" style="margin-right: 8px;"></i>GLOBAL MATCH CENTER
        </a>
    </div>
    <!-- Navigation (Hidden on small mobile for space if needed) -->
    <nav class="nav-links">
        <ul style="display: flex; gap: 20px; list-style: none; font-size: 11px; font-weight: 700;">
            <li><a href="index.html" style="color: #fff; text-decoration: none;">HOME</a></li>
            <li><a href="contact.html" style="color: #fff; text-decoration: none;">SUPPORT</a></li>
        </ul>
    </nav>
</header>

<div id="main-wrapper">
    <section class="hero-section">
        <!-- LEFT STACK -->
        <div class="left-stack">
            <div style="position: relative;">
                <i class="fas fa-search" style="position: absolute; left: 10px; top: 9px; color: rgba(0,210,255,0.5); font-size: 11px;"></i>
                <input type="text" id="matchSearch" onkeyup="filterMatches()" placeholder="Search..." 
                       style="width: 100%; padding: 6px 10px 6px 30px; border-radius: 5px; border: 1px solid rgba(0,210,255,0.2); background: rgba(255,255,255,0.03); color: white; outline: none; font-size: 11px;">
            </div>
            <div style="position: relative;">
                <select id="categorySelect" aria-label="Select Category" onchange="filterByCategory(this.value, event)" style="width: 100%; padding: 6px 10px; border-radius: 5px; border: 1px solid rgba(0,210,255,0.3); background: #0b141d; color: #00d2ff; font-size: 10px; font-weight: 700; text-transform: uppercase;">
                    <option value="all">CATEGORIES</option>
                    <option value="icc">International</option>
                    <option value="psl">PSL</option>
                    <option value="ipl">IPL</option>
                </select>
            </div>
        </div>

        <!-- RIGHT STACK -->
        <div class="right-stack">
            <a href="https://tamashaweb.com/" target="_blank" style="background: #111; border: 1px solid #333; color: white; padding: 6px 10px; text-decoration: none; border-radius: 5px; font-weight: 700; font-size: 10px; display: flex; align-items: center; justify-content: center;">
                <span style="height: 6px; width: 6px; background: #ff0000; border-radius: 50%; margin-right: 8px;"></span> Tamasha
            </a>
            <a href="https://www.tensportstv.com/" target="_blank" style="background: #111; border: 1px solid #333; color: white; padding: 6px 10px; text-decoration: none; border-radius: 50px; font-weight: 700; font-size: 10px; display: flex; align-items: center; justify-content: center;">
                <i class="fas fa-tv" style="margin-right: 8px; color: #92B558;"></i> Ten Sports
            </a>
        </div>

        <!-- CENTER CONTENT -->
        <div class="center-branding">
            <h1 style="margin: 0; font-size: 2.8rem; color: #ffffff; font-weight: 900; text-transform: uppercase;">🏏 Global Match Center</h1>
            <p style="margin: 10px 0 0; font-size: 13px; color: rgba(255,255,255,0.6);">Live Updates • Schedule</p>
        </div>
    </section>

    <main id="fixtures-container">
        <div id="fixtures-list">
            <div class="loading-state">
                <div class="spinner"></div>
                <p>Loading Live Schedule...</p>
            </div>
        </div>
    </main>
</div>

<script src="script.js" defer></script>
</body>
</html>
